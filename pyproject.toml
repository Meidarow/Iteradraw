[project]
name = "iteradraw"
version = "0.0.1"
description = "Compact and self-contained image slideshow app meant for art/gesture practice sessions."
authors = [
    {name = "Meidarow",email = "60526952+Meidarow@users.noreply.github.com"}
]
readme = "docs/README.md"
requires-python = ">=3.12, <3.15"
dependencies = [
    "pyside6 (>=6.10.0,<7.0.0)",
]
packages = [{include = "iteradraw"}]

[tool.poetry.dependencies]
pillow = { version = "^10.2", markers = "sys_platform == 'darwin'" }
pillow-simd = { version = ">=9.0.0", markers = "sys_platform == 'linux' and platform_machine != 'aarch64'" }

[tool.poetry]
package-mode = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.poetry.scripts]
docs-serve = "mkdocs.commands.serve:serve"
docs-build = "mkdocs.commands.build:build"
docs-deploy = "mkdocs.commands.gh_deploy:gh_deploy"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
poetry-core = "^2.1.3"
pre-commit = "^4.3.0"
coverage = "^7.10.7"
pytest-cov = "^7.0.0"
pytest = "^9.0.2"
pdoc = "^16.0.0"
ruff = "^0.15.6"
